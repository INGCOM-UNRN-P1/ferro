[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferro"
version = "0.2.0"
description = "Perfilador de rendimiento algorítmico y hardware counters en C"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@31f79c904ac33065cc1c2b9fd34b4c513f0028d9",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@ec62a77c6452750df644b78382e0ec6fb12a0f00",
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@9cefe644353851858f2e77b7936ed34ae1c510ea",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/ferro"
Repository = "https://github.com/INGCOM-UNRN-P1/ferro.git"
Issues = "https://github.com/INGCOM-UNRN-P1/ferro/issues"

[project.scripts]
ferro = "ferro.cli:app"

[project.entry-points."ripley.plugins"]
hardware_profiler = "ferro.plugins.ripley_plugin:FerroPlugin"

[dependency-groups]
# En `dependency-groups` (PEP 735) y no en `optional-dependencies`: uv instala
# este grupo con un `uv sync` a secas, de modo que el venv del repo queda listo
# para correr la suite. Como extra opcional había que acordarse de
# `--extra dev`, y sin eso `.venv/bin/python -m pytest` fallaba con
# "No module named pytest".
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true
